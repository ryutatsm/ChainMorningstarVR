name: Reference mesh and Skyrim VR NIF build gate
on:
  workflow_dispatch:
  push:
    paths: ["Source/NIF/**", "Source/Textures/**", "Tests/test_material_maps.py", "Tools/write_asset_provenance.py", "Tools/package_visual_test.py", ".github/workflows/windows-nif-build.yml"]
  pull_request:
    paths: ["Source/NIF/**", "Source/Textures/**", "Tests/test_material_maps.py", "Tools/write_asset_provenance.py", "Tools/package_visual_test.py", ".github/workflows/windows-nif-build.yml"]
permissions:
  contents: read
jobs:
  nif:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned nifly source
        uses: actions/checkout@v4
        with:
          repository: ousnius/nifly
          ref: cca0a770094bb962fb28ea1fec5ea903e68fda8e
          path: .deps/nifly
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic asset dependencies
        run: python -m pip install -r Source/NIF/requirements-assets.txt
      - name: Compile portable NIF writer
        run: |
          cmake -S Source/NIF -B build/asset-exporter -A x64 "-DCMS_NIFLY_ROOT=$env:GITHUB_WORKSPACE/.deps/nifly"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build build/asset-exporter --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "NIF writer compile failed" }
      - name: Build textures and decode all mipmaps
        run: |
          python Source/Textures/generate_textures.py
          if ($LASTEXITCODE -ne 0) { throw "Texture generation failed" }
          python Source/Textures/encode_dds.py build/textures/weapons/ChainMorningstarVR
          if ($LASTEXITCODE -ne 0) { throw "DDS validation failed" }
          python Tests/test_material_maps.py
          if ($LASTEXITCODE -ne 0) { throw "Material direction/specular regression failed" }
      - name: Build and inspect actual geometry
        run: |
          python Source/NIF/generate_reference_mesh.py --out build/visual-preview --textures build/textures/weapons/ChainMorningstarVR
          if ($LASTEXITCODE -ne 0) { throw "Mesh generation failed" }
          python Source/NIF/validate_reference_assets.py --build build
          if ($LASTEXITCODE -ne 0) { throw "Geometry validation failed" }
          New-Item -ItemType Directory -Force build/meshes/weapons/ChainMorningstarVR | Out-Null
          & build/asset-exporter/Release/export_reference_nif.exe build/visual-preview/reference_mesh.cms build/meshes/weapons/ChainMorningstarVR/ChainMorningstar.nif
          if ($LASTEXITCODE -ne 0) { throw "NIF roundtrip failed" }
      - name: Record exact source and output provenance
        run: |
          python Tools/write_asset_provenance.py --commit "$env:GITHUB_SHA" --build build
          if ($LASTEXITCODE -ne 0) { throw "Asset provenance failed" }
      - name: Upload development assets (not a playable release)
        uses: actions/upload-artifact@v4
        with:
          name: ChainMorningstarVR-reference-assets-dev
          path: |
            build/meshes/
            build/ASSET_BUILD_PROVENANCE.json
            build/textures/**/*.dds
            build/textures/**/texture_validation.json
            build/textures/**/material_generation.json
            build/visual-preview/asset_manifest.json
            build/visual-preview/reference_mesh.cms
          if-no-files-found: error
      - name: Upload model preview separately
        uses: actions/upload-artifact@v4
        with:
          name: ChainMorningstarVR-model-preview-dev
          path: build/visual-preview/ChainMorningstar_reference.glb
          if-no-files-found: error
