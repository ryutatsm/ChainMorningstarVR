name: Windows Skyrim VR Conan compile gate

on:
  workflow_dispatch:
  push:
    paths:
      - ".ci/conanfile.txt"
      - ".github/workflows/windows-vr-conan.yml"

jobs:
  conan-vr:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Conan 1.x and Ninja
        run: |
          python -m pip install --disable-pip-version-check "conan>=1.60,<2"
          choco install ninja --no-progress -y
          conan --version
          ninja --version

      - name: Configure Conan profile and Color-Glass remote
        run: |
          conan profile new default --detect --force
          conan remote add colorglass https://charmedbaryon.jfrog.io/artifactory/api/conan/default-conan --force
          conan profile show default
          conan remote list

      - name: Fetch prebuilt CommonLibSSE-NG VR
        run: conan install "$env:GITHUB_WORKSPACE\.ci\conanfile.txt" --install-folder "$env:GITHUB_WORKSPACE\build-conan\deps" -s build_type=Release -s arch=x86_64 -s compiler="Visual Studio" -s compiler.version=17 --build=never

      - name: Configure plugin with Conan toolchain
        run: cmake -S "$env:GITHUB_WORKSPACE\Source\SKSE\PluginSkeleton" -B "$env:GITHUB_WORKSPACE\build-conan\plugin" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\build-conan\deps\conan_toolchain.cmake"

      - name: Compile plugin
        run: cmake --build "$env:GITHUB_WORKSPACE\build-conan\plugin"

      - name: Stage artifact
        run: |
          $dll = Get-ChildItem "$env:GITHUB_WORKSPACE\build-conan\plugin" -Recurse -Filter ChainMorningstarVR.dll | Select-Object -First 1
          if (-not $dll) { throw "ChainMorningstarVR.dll not found" }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\ci-conan-artifact\SKSE\Plugins" | Out-Null
          Copy-Item $dll.FullName "$env:GITHUB_WORKSPACE\ci-conan-artifact\SKSE\Plugins\ChainMorningstarVR.dll"
          (Get-FileHash "$env:GITHUB_WORKSPACE\ci-conan-artifact\SKSE\Plugins\ChainMorningstarVR.dll" -Algorithm SHA256).Hash.ToLower() | Set-Content "$env:GITHUB_WORKSPACE\ci-conan-artifact\ChainMorningstarVR.dll.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChainMorningstarVR-v0.4.0-dev-conan
          path: ci-conan-artifact
          if-no-files-found: error
