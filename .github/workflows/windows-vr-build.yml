name: Windows Skyrim VR compile gate

on:
  workflow_dispatch:
  push:
    paths:
      - "Source/SKSE/**"
      - "Source/ThirdParty/**"
      - "Source/NIF/**"
      - "Source/Textures/**"
      - "Tests/test_material_maps.py"
      - "Tools/write_asset_provenance.py"
      - "Tools/package_visual_test.py"
      - ".github/workflows/windows-nif-build.yml"
      - ".github/workflows/windows-vr-build.yml"
  pull_request:
    paths:
      - "Source/SKSE/**"
      - "Source/ThirdParty/**"
      - "Source/NIF/**"
      - "Source/Textures/**"
      - "Tests/test_material_maps.py"
      - "Tools/write_asset_provenance.py"
      - "Tools/package_visual_test.py"
      - ".github/workflows/windows-nif-build.yml"
      - ".github/workflows/windows-vr-build.yml"

concurrency:
  group: chain-morningstar-vr-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vr:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    env:
      CMS_VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_COMMIT: eb2d3a3279fd019cb7733072d86900d0ad2a1aef
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
      PLUGIN_SRC: ${{ github.workspace }}\Source\SKSE\PluginSkeleton

    steps:
      - name: Checkout Chain Morningstar source
        uses: actions/checkout@v4

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: cms-vcpkg-${{ runner.os }}-${{ hashFiles('Source/SKSE/PluginSkeleton/vcpkg.json', 'Source/SKSE/PluginSkeleton/vcpkg-configuration.json') }}
          restore-keys: |
            cms-vcpkg-${{ runner.os }}-

      - name: Verify direct full runtime source
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          $required = @(
            "$env:PLUGIN_SRC\RuntimeService.cpp",
            "$env:PLUGIN_SRC\PlayerUpdateHook.cpp",
            "$env:PLUGIN_SRC\SkyrimVRSceneBridge.cpp",
            "$env:PLUGIN_SRC\PlanckBuildProbe.cpp",
            "$env:PLUGIN_SRC\NativePhysicsBackend.cpp",
            "$env:PLUGIN_SRC\NativeWorldSweep.cpp",
            "$env:PLUGIN_SRC\NativeChainCollision.cpp",
            "$env:PLUGIN_SRC\NativeContactRouter.cpp",
            "$env:PLUGIN_SRC\WeaponMeshContact.cpp",
            "$env:GITHUB_WORKSPACE\Source\SKSE\HeadContactPlanes.hpp",
            "$env:GITHUB_WORKSPACE\Source\ThirdParty\HIGGS\HiggsInterface001.hpp",
            "$env:GITHUB_WORKSPACE\Source\SKSE\ChainPhysicsCore.hpp",
            "$env:GITHUB_WORKSPACE\Source\SKSE\ChainRuntimeCore.hpp",
            "$env:GITHUB_WORKSPACE\Source\SKSE\GameBridgeContract.hpp"
          )
          foreach ($p in $required) {
            if (-not (Test-Path $p)) { throw "Required source missing: $p" }
          }

      - name: Parse feedback collector PowerShell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$env:GITHUB_WORKSPACE\Tools\Collect_CMS_Logs.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }

      - name: Enable MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Bootstrap pinned vcpkg
        run: |
          if (Test-Path "$env:CMS_VCPKG_ROOT") {
            Remove-Item -Recurse -Force "$env:CMS_VCPKG_ROOT"
          }
          git clone https://github.com/microsoft/vcpkg.git "$env:CMS_VCPKG_ROOT"
          git -C "$env:CMS_VCPKG_ROOT" checkout "$env:VCPKG_COMMIT"
          & "$env:CMS_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Verify build tools
        run: |
          cmake --version
          ninja --version

      - name: Configure physics test build
        working-directory: ${{ env.PLUGIN_SRC }}
        run: cmake --preset vr-physics-test

      - name: Compile physics test DLL
        working-directory: ${{ env.PLUGIN_SRC }}
        run: cmake --build --preset vr-physics-test

      - name: Stage physics test DLL and checksum
        id: stage
        run: |
          $projectText = Get-Content "$env:PLUGIN_SRC\CMakeLists.txt" -Raw
          $versionMatch = [regex]::Match($projectText, 'project\(ChainMorningstarVR VERSION ([0-9.]+)')
          if (-not $versionMatch.Success) { throw "CMake version missing" }
          $cmsVersion = $versionMatch.Groups[1].Value
          "version=$cmsVersion" >> $env:GITHUB_OUTPUT
          $builtDll = Get-ChildItem "$env:PLUGIN_SRC\build\vr-physics-test" -Recurse -Filter ChainMorningstarVR.dll | Select-Object -First 1
          if (-not $builtDll) { throw "Physics test ChainMorningstarVR.dll not found" }
          $dir = "$env:GITHUB_WORKSPACE\ci-artifact\SKSE\Plugins"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $builtDll.FullName "$dir\ChainMorningstarVR.dll"
          (Get-FileHash "$dir\ChainMorningstarVR.dll" -Algorithm SHA256).Hash.ToLower() |
            Set-Content "$env:GITHUB_WORKSPACE\ci-artifact\ChainMorningstarVR.dll.sha256"
          $sourceRoot = "$env:GITHUB_WORKSPACE\Source\SKSE"
          $sourceHashes = Get-ChildItem $sourceRoot -Recurse -File |
            Where-Object { $_.FullName -notlike "*\build\*" } |
            Sort-Object FullName |
            ForEach-Object {
              [ordered]@{
                path = $_.FullName.Substring($sourceRoot.Length + 1).Replace('\', '/')
                sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              }
            }
          ConvertTo-Json -InputObject @($sourceHashes) -Depth 3 |
            Set-Content "$env:GITHUB_WORKSPACE\ci-artifact\DLL_SOURCE_SHA256.json"
          $thirdPartyRoot = "$env:GITHUB_WORKSPACE\Source\ThirdParty"
          $thirdPartyHashes = Get-ChildItem $thirdPartyRoot -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              [ordered]@{
                path = $_.FullName.Substring($env:GITHUB_WORKSPACE.Length + 1).Replace('\', '/')
                sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              }
            }
          ConvertTo-Json -InputObject @($thirdPartyHashes) -Depth 3 |
            Set-Content "$env:GITHUB_WORKSPACE\ci-artifact\DLL_THIRD_PARTY_SHA256.json"
          @"
          ChainMorningstarVR $cmsVersion physics test -- NOT A RELEASE
          Commit: $env:GITHUB_SHA
          HIGGS head-compound collision and solver contact feedback are connected.
          Enemy head/weapon contacts feed the one-in-three worn-instance drop policy.
          Requires HIGGS >= 1.6.0; PLANCK supplies NPC physics and melee damage.
          Chain links use swept capsule queries against world and NPC bodies without attack bodies or damage.
          Chain response is one-way: links bend and slide but do not push objects/NPCs.
          Version 0.8.1 replaces generic metal audio with paired large-metal-body and blunt-metal-strike cues.
          The user reported 0.8.0 working but its impact audio was hard to hear; the new mix needs in-game listening.
          "@ | Set-Content "$env:GITHUB_WORKSPACE\ci-artifact\BUILD_STATUS.txt"

      - name: Upload physics test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChainMorningstarVR-v${{ steps.stage.outputs.version }}-physics-test-dll
          path: ci-artifact
          if-no-files-found: error
