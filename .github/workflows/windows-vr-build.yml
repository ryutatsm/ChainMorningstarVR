name: Windows Skyrim VR compile gate

on:
  workflow_dispatch:
  push:
    paths:
      - "Source/SKSE/**"
      - ".github/workflows/windows-vr-build.yml"
  pull_request:
    paths:
      - "Source/SKSE/**"
      - ".github/workflows/windows-vr-build.yml"

concurrency:
  group: chain-morningstar-vr-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-vr:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    env:
      CMS_VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_COMMIT: eb2d3a3279fd019cb7733072d86900d0ad2a1aef
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
      PLUGIN_SRC: ${{ github.workspace }}\Source\SKSE\PluginSkeleton

    steps:
      - name: Checkout Chain Morningstar source
        uses: actions/checkout@v4

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: cms-vcpkg-${{ runner.os }}-${{ hashFiles('Source/SKSE/PluginSkeleton/vcpkg.json', 'Source/SKSE/PluginSkeleton/vcpkg-configuration.json') }}
          restore-keys: |
            cms-vcpkg-${{ runner.os }}-

      - name: Verify direct full runtime source
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          $required = @(
            "$env:PLUGIN_SRC\RuntimeService.cpp",
            "$env:PLUGIN_SRC\PlayerUpdateHook.cpp",
            "$env:PLUGIN_SRC\SkyrimVRSceneBridge.cpp",
            "$env:PLUGIN_SRC\PlanckBuildProbe.cpp",
            "$env:GITHUB_WORKSPACE\Source\SKSE\ChainPhysicsCore.hpp",
            "$env:GITHUB_WORKSPACE\Source\SKSE\ChainRuntimeCore.hpp",
            "$env:GITHUB_WORKSPACE\Source\SKSE\GameBridgeContract.hpp"
          )
          foreach ($p in $required) {
            if (-not (Test-Path $p)) { throw "Required source missing: $p" }
          }

      - name: Enable MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Bootstrap pinned vcpkg
        run: |
          if (Test-Path "$env:CMS_VCPKG_ROOT") {
            Remove-Item -Recurse -Force "$env:CMS_VCPKG_ROOT"
          }
          git clone https://github.com/microsoft/vcpkg.git "$env:CMS_VCPKG_ROOT"
          git -C "$env:CMS_VCPKG_ROOT" checkout "$env:VCPKG_COMMIT"
          & "$env:CMS_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Verify build tools
        run: |
          cmake --version
          ninja --version

      - name: Configure release build
        working-directory: ${{ env.PLUGIN_SRC }}
        run: cmake --preset vr-release

      - name: Compile release DLL
        working-directory: ${{ env.PLUGIN_SRC }}
        run: cmake --build --preset vr-release

      - name: Configure read-only diagnostic build
        working-directory: ${{ env.PLUGIN_SRC }}
        run: cmake --preset vr-diagnostic

      - name: Compile read-only diagnostic DLL
        working-directory: ${{ env.PLUGIN_SRC }}
        run: cmake --build --preset vr-diagnostic

      - name: Configure native proxy test build
        working-directory: ${{ env.PLUGIN_SRC }}
        run: cmake --preset vr-native-proxy-test

      - name: Compile native proxy test DLL
        working-directory: ${{ env.PLUGIN_SRC }}
        run: cmake --build --preset vr-native-proxy-test

      - name: Stage DLLs and checksums
        run: |
          $release = Get-ChildItem "$env:PLUGIN_SRC\build\vr-release" -Recurse -Filter ChainMorningstarVR.dll | Select-Object -First 1
          $diag = Get-ChildItem "$env:PLUGIN_SRC\build\vr-diagnostic" -Recurse -Filter ChainMorningstarVR.dll | Select-Object -First 1
          $proxy = Get-ChildItem "$env:PLUGIN_SRC\build\vr-native-proxy-test" -Recurse -Filter ChainMorningstarVR.dll | Select-Object -First 1
          if (-not $release) { throw "Release ChainMorningstarVR.dll not found" }
          if (-not $diag) { throw "Diagnostic ChainMorningstarVR.dll not found" }
          if (-not $proxy) { throw "Native proxy test ChainMorningstarVR.dll not found" }

          $releaseDir = "$env:GITHUB_WORKSPACE\ci-artifact\release\SKSE\Plugins"
          $diagDir = "$env:GITHUB_WORKSPACE\ci-artifact\diagnostic-readonly\SKSE\Plugins"
          $proxyDir = "$env:GITHUB_WORKSPACE\ci-artifact\native-proxy-test\SKSE\Plugins"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          New-Item -ItemType Directory -Force -Path $diagDir | Out-Null
          New-Item -ItemType Directory -Force -Path $proxyDir | Out-Null

          Copy-Item $release.FullName "$releaseDir\ChainMorningstarVR.dll"
          Copy-Item $diag.FullName "$diagDir\ChainMorningstarVR.dll"
          Copy-Item $proxy.FullName "$proxyDir\ChainMorningstarVR.dll"

          (Get-FileHash "$releaseDir\ChainMorningstarVR.dll" -Algorithm SHA256).Hash.ToLower() |
            Set-Content "$env:GITHUB_WORKSPACE\ci-artifact\release\ChainMorningstarVR.dll.sha256"
          (Get-FileHash "$diagDir\ChainMorningstarVR.dll" -Algorithm SHA256).Hash.ToLower() |
            Set-Content "$env:GITHUB_WORKSPACE\ci-artifact\diagnostic-readonly\ChainMorningstarVR.dll.sha256"
          (Get-FileHash "$proxyDir\ChainMorningstarVR.dll" -Algorithm SHA256).Hash.ToLower() |
            Set-Content "$env:GITHUB_WORKSPACE\ci-artifact\native-proxy-test\ChainMorningstarVR.dll.sha256"

          @"
          ChainMorningstarVR v0.4.3-dev
          release = normal fail-closed build
          diagnostic-readonly = VRMeleeData candidate layout READ ONLY; performs no VRMeleeData writes
          native-proxy-test = TEST ONLY; swaps current-hand collisionNode to CMS_HeadNode after layout validation and restores it on release
          "@ | Set-Content "$env:GITHUB_WORKSPACE\ci-artifact\README.txt"

      - name: Upload compile-gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChainMorningstarVR-v0.4.3-dev-release-diagnostic-proxytest
          path: ci-artifact
          if-no-files-found: error
