name: Windows Skyrim VR compile gate

on:
  workflow_dispatch:
  push:
    paths:
      - "Source/SKSE/**"
      - ".ci/skse-full-source.tgz.b64"
      - ".github/workflows/windows-vr-build.yml"
  pull_request:
    paths:
      - "Source/SKSE/**"
      - ".ci/skse-full-source.tgz.b64"
      - ".github/workflows/windows-vr-build.yml"

jobs:
  build-vr:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    env:
      CMS_VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_COMMIT: eb2d3a3279fd019cb7733072d86900d0ad2a1aef
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
      PLUGIN_SRC: ${{ github.workspace }}\Source\SKSE\PluginSkeleton

    steps:
      - name: Checkout Chain Morningstar source
        uses: actions/checkout@v4

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: cms-vcpkg-${{ runner.os }}-${{ hashFiles('Source/SKSE/PluginSkeleton/vcpkg.json', 'Source/SKSE/PluginSkeleton/vcpkg-configuration.json') }}
          restore-keys: |
            cms-vcpkg-${{ runner.os }}-

      - name: Expand full v0.4 SKSE source payload
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          $b64 = Get-Content "$env:GITHUB_WORKSPACE\.ci\skse-full-source.tgz.b64" -Raw
          $archive = "$env:RUNNER_TEMP\skse-full-source.tgz"
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($b64.Trim()))
          $expected = "9c6b91b11a0c36c4fa253d3ff737e60bd3bb0d5451aad2aacda3fae97e79d256"
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Full source archive SHA256 mismatch: $actual" }
          tar -tzf $archive | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Full source archive failed tar integrity listing" }
          tar -xzf $archive -C "$env:GITHUB_WORKSPACE\Source\SKSE"
          if ($LASTEXITCODE -ne 0) { throw "Full source archive extraction failed" }
          if (-not (Test-Path "$env:PLUGIN_SRC\SkyrimVRSceneBridge.cpp")) { throw "Full source payload did not expand" }

      - name: Enable MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Bootstrap pinned vcpkg
        run: |
          if (Test-Path "$env:CMS_VCPKG_ROOT") {
            Remove-Item -Recurse -Force "$env:CMS_VCPKG_ROOT"
          }
          git clone https://github.com/microsoft/vcpkg.git "$env:CMS_VCPKG_ROOT"
          git -C "$env:CMS_VCPKG_ROOT" checkout "$env:VCPKG_COMMIT"
          & "$env:CMS_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Verify build tools
        run: |
          cmake --version
          ninja --version
          Write-Host "MSVC VCToolsVersion=$env:VCToolsVersion"

      - name: Configure full VR build
        working-directory: ${{ env.PLUGIN_SRC }}
        run: cmake --preset vr-release

      - name: Compile full VR DLL
        working-directory: ${{ env.PLUGIN_SRC }}
        run: cmake --build --preset vr-release

      - name: Locate DLL and write checksum
        run: |
          $dll = Get-ChildItem "$env:PLUGIN_SRC\build\vr-release" -Recurse -Filter ChainMorningstarVR.dll | Select-Object -First 1
          if (-not $dll) { throw "ChainMorningstarVR.dll not found" }
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\ci-artifact\SKSE\Plugins" | Out-Null
          Copy-Item $dll.FullName "$env:GITHUB_WORKSPACE\ci-artifact\SKSE\Plugins\ChainMorningstarVR.dll"
          (Get-FileHash "$env:GITHUB_WORKSPACE\ci-artifact\SKSE\Plugins\ChainMorningstarVR.dll" -Algorithm SHA256).Hash.ToLower() | Set-Content "$env:GITHUB_WORKSPACE\ci-artifact\ChainMorningstarVR.dll.sha256"

      - name: Upload compile-gate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChainMorningstarVR-v0.4.0-dev-full-dll
          path: ci-artifact
          if-no-files-found: error
