name: Physics and equipment policy tests

on:
  workflow_dispatch:
  push:
    paths:
      - "Source/SKSE/**"
      - "Tests/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "Source/SKSE/**"
      - "Tests/**"
      - ".github/workflows/core-tests.yml"

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run dependency-free behavior tests
        shell: bash
        run: |
          set -euo pipefail
          for test in Tests/*_ci.cpp; do
            name=$(basename "$test" .cpp)
            g++ -std=c++23 -O2 -Wall -Wextra -Werror -pedantic -I. "$test" -o "$name"
            "./$name"
          done
