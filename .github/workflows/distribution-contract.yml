name: Vendor runtime contract

on:
  workflow_dispatch:
  push:
    paths:
      - "Source/xEdit/**"
      - "Source/SKSE/PluginSkeleton/EorlundVendor.*"
      - "Source/SKSE/PluginSkeleton/PluginSkeleton.cpp"
      - "Tests/validate_distribution_contract.py"
      - ".github/workflows/distribution-contract.yml"
  pull_request:
    paths:
      - "Source/xEdit/**"
      - "Source/SKSE/PluginSkeleton/EorlundVendor.*"
      - "Source/SKSE/PluginSkeleton/PluginSkeleton.cpp"
      - "Tests/validate_distribution_contract.py"
      - ".github/workflows/distribution-contract.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate self-contained vendor injection contract
        run: python Tests/validate_distribution_contract.py
