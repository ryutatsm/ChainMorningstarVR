name: Authored Blender unified test (audit6)
on:
  workflow_dispatch:
  push:
    branches: [codex/blender-finish]
    paths: ["Assets/BlenderFinish/**", "Assets/Audit6Baseline/**", "Tools/Blender/**", "Source/NIF/inspect_nif_materials.cpp", "Source/NIF/CMakeLists.txt", "Tests/test_blender_optimization.py", "Tests/test_blender_under4k.py", "Tests/test_unified_package.py", "Tests/test_blender_lighting.py", ".github/workflows/blender-visual-test.yml"]
permissions:
  contents: read
jobs:
  overlay:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ousnius/nifly
          ref: cca0a770094bb962fb28ea1fec5ea903e68fda8e
          path: .deps/nifly
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned DDS dependencies
        run: |
          python -m pip install Pillow==12.3.0 numpy==2.3.5
          if ($LASTEXITCODE -ne 0) { throw "Dependency setup failed" }
      - name: Verify the authored Blender inputs
        run: |
          python Tools/Blender/validate_optimized_inputs.py Assets/BlenderFinish
          if ($LASTEXITCODE -ne 0) { throw "Authored input contract failed" }
      - name: Compile pinned NIF writer
        run: |
          cmake -S Source/NIF -B build/blender-finish-writer -A x64 "-DCMS_NIFLY_ROOT=$env:GITHUB_WORKSPACE/.deps/nifly"
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }
          cmake --build build/blender-finish-writer --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Writer build failed" }
      - name: Package the saved edit and selected DDS maps
        run: |
          python Tools/Blender/package_optimized_visuals.py --cms Assets/BlenderFinish/optimized.cms --baseline-cms Assets/BlenderFinish/audit6_baseline.cms --blend Assets/BlenderFinish/ChainMorningstarVR_work.blend --textures Assets/BlenderFinish/textures --writer build/blender-finish-writer/Release/export_reference_nif.exe --out build/blender-finish-overlay/ChainMorningstarVR-audit6-leather-edge-test.zip
          if ($LASTEXITCODE -ne 0) { throw "Overlay gate failed" }
      - name: Verify full package equivalence and rejected unsafe inputs
        run: |
          python Tests/test_unified_package.py --baseline-zip Assets/Audit6Baseline/ChainMorningstarVR-1.0.0-audit6-diagnostic.zip --overlay build/blender-finish-overlay/ChainMorningstarVR-audit6-leather-edge-test.zip --inputs Assets/BlenderFinish/UNIFIED_PAYLOAD_SHA256.json
          if ($LASTEXITCODE -ne 0) { throw "Unified package tests failed" }
      - name: Assemble complete Vortex test MOD with pinned audit6 runtime
        run: |
          python Tools/Blender/package_unified_test.py --baseline-zip Assets/Audit6Baseline/ChainMorningstarVR-1.0.0-audit6-diagnostic.zip --overlay build/blender-finish-overlay/ChainMorningstarVR-audit6-leather-edge-test.zip --inputs Assets/BlenderFinish/UNIFIED_PAYLOAD_SHA256.json --out build/blender-finish-overlay/ChainMorningstarVR-1.0.0-audit6-unified-3996-test.zip
          if ($LASTEXITCODE -ne 0) { throw "Unified package gate failed" }
      - name: Assemble lighting-corrected complete Vortex MOD
        run: |
          python Tools/Blender/package_lighting_test.py --baseline-zip Assets/Audit6Baseline/ChainMorningstarVR-1.0.0-audit6-diagnostic.zip --overlay build/blender-finish-overlay/ChainMorningstarVR-audit6-leather-edge-test.zip --inputs Assets/BlenderFinish/UNIFIED_PAYLOAD_SHA256.json --inspector build/blender-finish-writer/Release/inspect_nif_materials.exe --out build/blender-finish-overlay/ChainMorningstarVR-1.0.0-audit6-unified-lighting-test.zip
          if ($LASTEXITCODE -ne 0) { throw "Lighting package gate failed" }
      - name: Verify lighting-only byte changes and independent NIF parsing
        run: |
          python Tests/test_blender_lighting.py --nif build/blender-finish-overlay/ChainMorningstarVR-audit6-leather-edge-test.nif --inspector build/blender-finish-writer/Release/inspect_nif_materials.exe --previous-zip build/blender-finish-overlay/ChainMorningstarVR-1.0.0-audit6-unified-3996-test.zip --lighting-zip build/blender-finish-overlay/ChainMorningstarVR-1.0.0-audit6-unified-lighting-test.zip
          if ($LASTEXITCODE -ne 0) { throw "Lighting-only contract failed" }
      # Never invoke generate_reference_mesh.py, generate_textures.py or
      # create_project.py here: these inputs are the saved, reviewed Blender edit.
      - uses: actions/upload-artifact@v4
        with:
          name: ChainMorningstarVR-audit6-unified-test
          path: |
            build/blender-finish-overlay/*.zip
            build/blender-finish-overlay/*.provenance.json
            build/blender-finish-overlay/*.inspection.json
          if-no-files-found: error
