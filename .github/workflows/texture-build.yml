name: Clean-room DDS texture build gate

on:
  workflow_dispatch:
  push:
    paths:
      - "Tools/Textures/**"
      - ".github/workflows/texture-build.yml"
  pull_request:
    paths:
      - "Tools/Textures/**"
      - ".github/workflows/texture-build.yml"

jobs:
  textures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned texture toolchain
        run: python -m pip install --disable-pip-version-check "Pillow==12.0.0" "numpy==2.3.3"

      - name: Generate and validate BC3/BC5 DDS textures
        env:
          CMS_TEXTURE_OUT: ${{ github.workspace }}/texture-artifact/textures/weapons/ChainMorningstarVR
        run: python Tools/Textures/generate_textures.py

      - name: Hash texture artifact contents
        shell: bash
        run: |
          cd texture-artifact
          find textures -type f -name '*.dds' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload validated textures
        uses: actions/upload-artifact@v4
        with:
          name: ChainMorningstarVR-cleanroom-textures
          path: texture-artifact
          if-no-files-found: error
